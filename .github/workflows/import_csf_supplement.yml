name: Import original CSF supplemental spreadsheet
on:
  push:
    paths:
      - ".github/workflows/import_csf_supplement.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original publicly available supplementary dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 4 --retry-delay 3             "https://pmc.ncbi.nlm.nih.gov/articles/instance/9240109/bin/NIHMS1771217-supplement-Supplemental_Table_7.xlsx"             --output data/NIHMS1771217-supplement-Supplemental_Table_7.xlsx
          echo "513135926b759a1dbce3811e1391ead1ab2b021ce0833dc2393f7287a1ad0aa7  data/NIHMS1771217-supplement-Supplemental_Table_7.xlsx" | sha256sum --check
      - name: Add dataset to this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/NIHMS1771217-supplement-Supplemental_Table_7.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Add original 2022 CSF peptide supplemental table"
            git push
          fi
